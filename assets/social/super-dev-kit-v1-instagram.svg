<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#11142a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 180) rotate(135) scale(520)">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 1180) rotate(-35) scale(520)">
      <stop offset="0%" stop-color="#d946ef" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101d33"/>
      <stop offset="100%" stop-color="#0a1324"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="1350" fill="url(#glow1)"/>
  <rect width="1080" height="1350" fill="url(#glow2)"/>

  <g opacity=".9">
    <circle cx="86" cy="88" r="5" fill="#22d3ee"/>
    <text x="108" y="96" fill="#b8c7dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600">OPEN SOURCE • STABLE RELEASE</text>
  </g>

  <g transform="translate(72 156)">
    <rect x="0" y="0" width="226" height="62" rx="31" fill="#0f2431" stroke="#22d3ee" stroke-opacity=".45"/>
    <text x="113" y="40" text-anchor="middle" fill="#7cecff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">v1.0.0</text>
  </g>

  <text x="72" y="330" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-3">SUPER DEV KIT</text>
  <rect x="72" y="357" width="530" height="8" rx="4" fill="url(#accent)"/>

  <text x="72" y="442" fill="#d9e5f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="600">
    <tspan x="72" dy="0">Prepare, valide e reproduza</tspan>
    <tspan x="72" dy="50">ambientes de desenvolvimento.</tspan>
  </text>

  <text x="72" y="575" fill="#8fa4bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">
    Windows • Ubuntu/Linux • Docker • Dev Doctor • Stacks • Templates
  </text>

  <g filter="url(#shadow)" transform="translate(72 645)">
    <rect width="936" height="410" rx="34" fill="url(#panel)" stroke="#23405f" stroke-width="2"/>
    <rect width="936" height="82" rx="34" fill="#132238"/>
    <circle cx="46" cy="41" r="10" fill="#ff5f57"/>
    <circle cx="78" cy="41" r="10" fill="#febc2e"/>
    <circle cx="110" cy="41" r="10" fill="#28c840"/>
    <text x="150" y="51" fill="#94a9c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">super-dev-kit — terminal</text>

    <text x="46" y="145" fill="#5eead4" font-family="Consolas,Menlo,monospace" font-size="28">$ devkit setup fullstack --dry-run</text>
    <text x="46" y="202" fill="#86efac" font-family="Consolas,Menlo,monospace" font-size="27">[OK] plano validado</text>

    <text x="46" y="265" fill="#5eead4" font-family="Consolas,Menlo,monospace" font-size="28">$ devkit doctor</text>
    <text x="46" y="322" fill="#86efac" font-family="Consolas,Menlo,monospace" font-size="27">[OK] ambiente saudável</text>

    <text x="46" y="375" fill="#7dd3fc" font-family="Consolas,Menlo,monospace" font-size="25">CMD • PowerShell • Bash • JSON automation</text>
  </g>

  <g transform="translate(72 1110)">
    <rect x="0" y="0" width="278" height="72" rx="22" fill="#0f2237" stroke="#2a4968"/>
    <text x="139" y="45" text-anchor="middle" fill="#e7f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">CLI multiplataforma</text>

    <rect x="294" y="0" width="238" height="72" rx="22" fill="#0f2237" stroke="#2a4968"/>
    <text x="413" y="45" text-anchor="middle" fill="#e7f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Dry-run seguro</text>

    <rect x="548" y="0" width="245" height="72" rx="22" fill="#0f2237" stroke="#2a4968"/>
    <text x="670" y="45" text-anchor="middle" fill="#e7f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">100% open source</text>
  </g>

  <text x="72" y="1266" fill="#8fa4bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">github.com/Ricar66/dev-environment-bootstrap</text>
  <text x="1008" y="1266" text-anchor="end" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">@ricardocoradini.dev</text>
</svg>