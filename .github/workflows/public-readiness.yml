name: Public Readiness

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate UTF-8 and local documentation links
        run: python3 tools/check-docs.py

      - name: Validate public JSON contracts
        run: |
          python3 -m json.tool cli/commands.json > /dev/null
          python3 -m json.tool modules/catalog.json > /dev/null
          python3 -m json.tool templates/catalog.json > /dev/null
          python3 -m json.tool versions/managers.json > /dev/null
          for file in schemas/*.json; do
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Validate versioned JSON Schemas
        run: |
          python3 -m pip install --disable-pip-version-check "jsonschema>=4.18,<5"
          python3 tools/check-contracts.py

  powershell7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: PowerShell 7 CLI smoke test
        shell: pwsh
        run: |
          ./devkit.ps1 version
          ./devkit.ps1 commands
          ./devkit.ps1 info
          ./devkit.ps1 config validate --config ./config/devkit.config.example.json
          ./devkit.ps1 help config
          ./devkit.ps1 stack react --dry-run
          ./devkit.ps1 project react-vite "PS7 Demo" --output ./.super-dev-kit/ps7 --dry-run
          ./devkit.ps1 runtime node 22 --manager fnm --dry-run

      - name: Validate docs from Windows
        shell: pwsh
        run: python tools/check-docs.py

  ubuntu2404:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ubuntu 24.04 disposable onboarding smoke test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3 git ca-certificates >/dev/null

              bash devkit.sh version
              bash devkit.sh info
              bash devkit.sh config validate --config config/devkit.config.example.json
              bash devkit.sh help info
              bash devkit.sh setup essential --dry-run
              bash devkit.sh stack react --dry-run
              bash devkit.sh project react-vite public-demo --output /tmp --dry-run
            '

  redis-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Redis Compose example
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f examples/redis/compose.yml down -v >/dev/null 2>&1 || true' EXIT

          docker compose -f examples/redis/compose.yml config > /dev/null
          docker compose -f examples/redis/compose.yml up -d

          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' super-dev-kit-redis 2>/dev/null || true)"
            echo "Redis health: ${status:-starting}"

            if [[ "$status" == "healthy" ]]; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              docker compose -f examples/redis/compose.yml logs redis
              exit 1
            fi

            sleep 2
          done

          test "$(docker exec super-dev-kit-redis redis-cli ping)" = "PONG"

  media-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate media from real CLI executions
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate-cli-media.py

      - name: Validate generated media
        run: |
          test -f docs/media/generated/cli-help.png
          test -f docs/media/generated/setup-fullstack-dry-run.png
          test -f docs/media/generated/dev-doctor.png
          test -f docs/media/generated/project-react-vite-dry-run.png
          test -f docs/media/generated/cli-demo.gif
          python3 -m json.tool docs/media/generated/capture-manifest.json > /dev/null
          python3 tools/check-docs.py
