name: Publish Stable Release

on:
  workflow_run:
    workflows: ["Validate Super Dev Kit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${GITHUB_SHA}"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for all required checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          required=("linux" "windows" "docs" "powershell7" "ubuntu2404")

          for attempt in $(seq 1 36); do
            checks="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

            all_done=true

            for name in "${required[@]}"; do
              conclusion="$(jq -r --arg name "$name" '
                [.check_runs[] | select(.name == $name)] |
                sort_by(.completed_at // .started_at // .created_at) |
                last |
                .conclusion // empty
              ' <<< "$checks")"

              status="$(jq -r --arg name "$name" '
                [.check_runs[] | select(.name == $name)] |
                sort_by(.completed_at // .started_at // .created_at) |
                last |
                .status // empty
              ' <<< "$checks")"

              echo "$name: status=${status:-missing} conclusion=${conclusion:-pending}"

              if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
                echo "Check obrigatório falhou: $name"
                exit 1
              fi

              if [[ "$conclusion" != "success" ]]; then
                all_done=false
              fi
            done

            if [[ "$all_done" == "true" ]]; then
              echo "Todos os checks obrigatórios estão verdes."
              exit 0
            fi

            echo "Aguardando checks obrigatórios... tentativa $attempt/36"
            sleep 10
          done

          echo "Timeout aguardando todos os checks obrigatórios."
          exit 1

      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION inválida: $version"
            exit 1
          fi

          notes="docs/releases/v${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes não encontradas: $notes"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} já existe. Mantendo a tag atual."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$TARGET_SHA" -m "Super Dev Kit ${TAG}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} já existe. Nada a fazer."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Super Dev Kit ${TAG}" \
            --notes-file "$NOTES"

          echo "Release ${TAG} publicada com sucesso."
